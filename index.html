
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="9BQpFVg7TF8y58ZfPgxLg0wxn9CTbhYcCYDtFgn6v-Q">
<title>Kaspercy Holdings Ltd. | Coming Soon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#07111f;color:#eef6ff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
body:before,body:after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(80px);opacity:.28;z-index:0;animation:float 9s ease-in-out infinite alternate}
body:before{background:#00d4ff;top:-150px;left:-120px}
body:after{background:#7c4dff;right:-150px;bottom:-160px;animation-delay:-4s}
.grid{position:fixed;inset:0;z-index:0;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:42px 42px}
.card{position:relative;z-index:1;width:min(920px,92%);padding:64px 58px;border:1px solid rgba(255,255,255,.13);border-radius:30px;background:rgba(11,24,42,.72);backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.42);text-align:center;animation:appear 1s ease both}
.badge{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border:1px solid rgba(0,212,255,.28);border-radius:999px;color:#82eaff;background:rgba(0,212,255,.08);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:25px}
.dot{width:7px;height:7px;border-radius:50%;background:#45e6ff;box-shadow:0 0 14px #45e6ff}
h1{font-size:clamp(38px,7vw,72px);line-height:1.02;letter-spacing:-2px;margin-bottom:20px;background:linear-gradient(100deg,#fff,#8eeeff 48%,#b59cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:650px;margin:0 auto;color:#aebdce;font-size:17px;line-height:1.7}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:650px;margin:42px auto 34px}
.unit{padding:20px 10px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.num{display:block;font-size:34px;font-weight:700;letter-spacing:-1px}
.label{display:block;margin-top:6px;color:#7f91a6;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.button{display:inline-block;text-decoration:none;color:#04111c;font-weight:700;padding:15px 28px;border-radius:14px;background:linear-gradient(100deg,#67e8f9,#a78bfa);box-shadow:0 12px 30px rgba(91,210,255,.18);transition:.25s ease}
.button:hover{transform:translateY(-3px);box-shadow:0 17px 38px rgba(91,210,255,.28)}
.footer{margin-top:30px;color:#627287;font-size:12px}
@keyframes float{to{transform:translate(55px,35px) scale(1.08)}}
@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:600px){.card{padding:45px 22px;border-radius:24px}.timer{gap:7px}.unit{padding:15px 5px}.num{font-size:25px}.sub{font-size:15px}}
</style>
</head>
<body>
<div class="grid"></div>
<main class="card">
<div class="badge"><span class="dot"></span> New Website Coming Soon</div>
<h1>Kaspercy Holdings Ltd.</h1>
<p class="sub">We are preparing something new. Our website is currently under development and will be available soon.</p>
<div class="timer">
<div class="unit"><span class="num" id="days">00</span><span class="label">Days</span></div>
<div class="unit"><span class="num" id="hours">00</span><span class="label">Hours</span></div>
<div class="unit"><span class="num" id="minutes">00</span><span class="label">Minutes</span></div>
<div class="unit"><span class="num" id="seconds">00</span><span class="label">Seconds</span></div>
</div>
<a class="button" href="https://kaspercyholdingsltd.github.io/Kaspercy/" target="_blank" rel="noopener">Visit Website</a>
<div class="footer">© <span id="year"></span> Kaspercy Holdings Ltd. All rights reserved.</div>
</main>
<script>
const target=new Date(Date.now()+83*24*60*60*1000);
function updateTimer(){
const diff=Math.max(0,target-Date.now());
document.getElementById("days").textContent=String(Math.floor(diff/86400000)).padStart(2,"0");
document.getElementById("hours").textContent=String(Math.floor(diff%86400000/3600000)).padStart(2,"0");
document.getElementById("minutes").textContent=String(Math.floor(diff%3600000/60000)).padStart(2,"0");
document.getElementById("seconds").textContent=String(Math.floor(diff%60000/1000)).padStart(2,"0");
}
document.getElementById("year").textContent=new Date().getFullYear();
updateTimer();setInterval(updateTimer,1000);
</script>
</body>
</html>
